<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Syncro AI | Onyx</title>
    <link rel="stylesheet" href="syncro-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="https://i.ibb.co/JjZPmBpV/Picsart-26-04-22-09-03-55-835.jpg">
</head>
<body>

<!-- OPENING SPLASH ANIMATION -->
<div id="syncro-splash">
    <div class="splash-bg"></div>
    <div class="splash-particles" id="splashParticles"></div>
    <div class="splash-content">
        <div class="splash-ring splash-ring-1"></div>
        <div class="splash-ring splash-ring-2"></div>
        <div class="splash-ring splash-ring-3"></div>
        <div class="splash-logo-wrap">
            <img src="https://i.ibb.co/JjZPmBpV/Picsart-26-04-22-09-03-55-835.jpg" alt="Syncro AI Logo" class="splash-logo">
        </div>
        <h1 class="splash-title">Syncro <span>AI</span></h1>
        <p class="splash-subtitle">Your intelligent assistant — powered by Onyx</p>
        <div class="splash-loader">
            <div class="splash-loader-bar"></div>
        </div>
    </div>
</div>

<!-- MAIN CHAT APP -->
<div class="chat-container" id="chatApp">

    <!-- Header -->
    <div class="chat-header">
        <div class="bot-avatar">
            <img src="https://i.ibb.co/JjZPmBpV/Picsart-26-04-22-09-03-55-835.jpg" alt="Syncro AI" class="ai-logo">
        </div>
        <div class="bot-info">
            <h2>Syncro <span class="gold-text">AI</span></h2>
            <p class="bot-tagline"><span class="status-dot"></span> Online · Your Onyx assistant</p>
        </div>
        <div class="header-actions">
            <button id="clearChatBtn" class="header-btn" title="Clear conversation">
                <i class="fas fa-trash-alt"></i>
            </button>
            <a href="index.html" class="home-button" title="Back to Home">
                <i class="fas fa-home"></i>
            </a>
        </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages"></div>

    <!-- Scroll to bottom button -->
    <button id="scrollBottomBtn" class="scroll-bottom-btn" style="opacity:0;">
        <i class="fas fa-chevron-down"></i>
    </button>

    <!-- Typing indicator -->
    <div class="typing-indicator" id="typingIndicator" style="display: none;">
        <div class="typing-avatar">
            <img src="https://i.ibb.co/JjZPmBpV/Picsart-26-04-22-09-03-55-835.jpg" alt="Syncro" style="width:100%;height:100%;object-fit:contain;border-radius:50%;">
        </div>
        <div class="typing-dots">
            <span></span><span></span><span></span>
        </div>
        <span class="typing-label">Syncro is thinking...</span>
    </div>

    <!-- Input -->
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask Syncro anything..." autocomplete="off">
        <button id="sendButton" title="Send">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>

    <!-- Footer -->
    <div class="chat-footer">
        <p><i class="fas fa-shield-alt"></i> Powered by Google's Gemini AI &middot; Conversations processed securely</p>
    </div>
</div>

<script src="syncro-script.js"></script>
<script>
(function() {
    var splash = document.getElementById('syncro-splash');
    var chatApp = document.getElementById('chatApp');
    var pc = document.getElementById('splashParticles');
    for (var i = 0; i < 40; i++) {
        var p = document.createElement('div');
        p.className = 'splash-particle';
        var size = Math.random() * 4 + 1;
        p.style.cssText = 'left:' + (Math.random()*100) + '%;top:' + (Math.random()*100) + '%;width:' + size + 'px;height:' + size + 'px;opacity:' + (Math.random()*0.6+0.2) + ';animation-duration:' + (Math.random()*8+6) + 's;animation-delay:' + (Math.random()*3) + 's;';
        pc.appendChild(p);
    }
    setTimeout(function() {
        splash.classList.add('splash-exit');
        chatApp.classList.add('chat-enter');
        setTimeout(function() { splash.style.display = 'none'; }, 800);
    }, 2800);
})();
</script>
</body>
</html>
