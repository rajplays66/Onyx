<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Syncro AI | Onyx</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
/* =========================================================
   SYNCRO AI — Gold & Black Theme  |  Onyx
   ========================================================= */
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');

:root {
    --gold:        #ffd700;
    --gold-light:  #ffed4e;
    --gold-dim:    #b8960c;
    --gold-glow:   rgba(255,215,0,0.35);
    --black:       #000000;
    --black-1:     #0a0a0a;
    --black-2:     #111111;
    --black-3:     #1a1a1a;
    --black-4:     #222222;
    --black-5:     #2d2d2d;
    --border:      rgba(255,215,0,0.18);
    --text:        #e8e0c8;
    --text-dim:    #9a9080;
    --user-bubble: #1a3a6e;
    --radius:      20px;
    --vh:          1vh;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: 'Inter', sans-serif;
    background: var(--black);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: calc(var(--vh, 1vh) * 100);
    padding: 20px;
    overflow-x: hidden;
}

/* =========================================================
   SPLASH ANIMATION
   ========================================================= */
#syncro-splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: var(--black);
}
.splash-bg {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(255,215,0,0.08) 0%, transparent 70%),
                linear-gradient(180deg, #0a0800 0%, #000000 100%);
}
.splash-particles { position: absolute; inset: 0; pointer-events: none; }
.splash-particle {
    position: absolute; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 6px var(--gold);
    animation: splashFloat linear infinite;
}
@keyframes splashFloat {
    0%   { transform: translateY(60px) scale(0); opacity: 0; }
    15%  { opacity: 1; transform: translateY(0) scale(1); }
    85%  { opacity: 0.7; }
    100% { transform: translateY(-80px) scale(0.5); opacity: 0; }
}
.splash-content {
    position: relative; display: flex; flex-direction: column;
    align-items: center;
    animation: splashContentIn 0.8s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes splashContentIn {
    from { opacity: 0; transform: translateY(30px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
.splash-ring {
    position: absolute; border-radius: 50%;
    border: 1.5px solid transparent;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
}
.splash-ring-1 { width:140px;height:140px; border-color: rgba(255,215,0,0.5) transparent transparent transparent; animation: ringRotate 2s linear infinite; }
.splash-ring-2 { width:170px;height:170px; border-color: transparent rgba(255,215,0,0.3) transparent transparent; animation: ringRotate 3s linear infinite reverse; }
.splash-ring-3 { width:200px;height:200px; border-color: rgba(255,215,0,0.15) transparent rgba(255,215,0,0.15) transparent; animation: ringRotate 4s linear infinite; }
@keyframes ringRotate { to { transform: translate(-50%,-50%) rotate(360deg); } }
.splash-logo-wrap {
    width:100px;height:100px; border-radius:50%; overflow:hidden;
    border:2.5px solid var(--gold); box-shadow:0 0 30px var(--gold-glow),0 0 60px rgba(255,215,0,0.15);
    animation: splashLogoPulse 2s ease-in-out infinite; margin-bottom:24px;
}
@keyframes splashLogoPulse {
    0%,100% { box-shadow:0 0 30px var(--gold-glow),0 0 60px rgba(255,215,0,0.15); }
    50%      { box-shadow:0 0 45px rgba(255,215,0,0.6),0 0 80px rgba(255,215,0,0.25); }
}
.splash-logo { width:100%;height:100%;object-fit:cover; }
.splash-title {
    font-family:'Cinzel',serif; font-size:2.8rem; font-weight:700;
    color:#fff; letter-spacing:0.12em; margin-bottom:10px;
    text-shadow:0 0 40px rgba(255,215,0,0.4);
}
.splash-title span { color:var(--gold); text-shadow:0 0 20px var(--gold),0 0 40px rgba(255,215,0,0.5); }
.splash-subtitle { font-size:0.9rem;color:var(--text-dim);letter-spacing:0.08em;margin-bottom:30px;text-align:center; }
.splash-loader { width:200px;height:3px;background:rgba(255,215,0,0.15);border-radius:4px;overflow:hidden; }
.splash-loader-bar { height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold),var(--gold-light));border-radius:4px;animation:splashLoad 2.6s cubic-bezier(0.4,0,0.2,1) forwards; }
@keyframes splashLoad { 0%{width:0%} 30%{width:40%} 70%{width:75%} 100%{width:100%} }
#syncro-splash.splash-exit { animation:splashFadeOut 0.8s cubic-bezier(0.4,0,1,1) forwards; }
@keyframes splashFadeOut { 0%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1.06);pointer-events:none} }

/* =========================================================
   CHAT APP
   ========================================================= */
#chatApp {
    opacity:0; transform:translateY(16px) scale(0.98);
    transition:opacity 0.7s ease,transform 0.7s ease; pointer-events:none;
}
#chatApp.chat-enter { opacity:1;transform:translateY(0) scale(1);pointer-events:all; }

.chat-container {
    width:100%; max-width:820px;
    height:88vh; height:calc(var(--vh,1vh)*88);
    background:var(--black-2); border-radius:var(--radius);
    border:1px solid var(--border); display:flex; flex-direction:column;
    overflow:hidden; position:relative;
    box-shadow:0 0 0 1px rgba(255,215,0,0.06),0 20px 60px rgba(0,0,0,0.7),0 0 80px rgba(255,215,0,0.04);
}
.chat-container::before {
    content:''; position:absolute; top:0;left:10%;right:10%;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent); opacity:0.6;
}

/* =========================================================
   HEADER
   ========================================================= */
.chat-header {
    background:linear-gradient(135deg,var(--black-1) 0%,var(--black-3) 100%);
    padding:16px 20px; display:flex; align-items:center; gap:12px;
    border-bottom:1px solid var(--border); position:relative; flex-shrink:0;
}
.chat-header::after {
    content:''; position:absolute; bottom:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold-light) 50%,var(--gold) 70%,transparent);
}
.bot-avatar {
    width:50px;height:50px;min-width:50px; border-radius:50%;
    border:2px solid var(--gold); box-shadow:0 0 16px var(--gold-glow);
    overflow:hidden; background:#1a1400; padding:2px;
    animation:avatarPulse 3s ease-in-out infinite;
}
@keyframes avatarPulse {
    0%,100%{box-shadow:0 0 16px var(--gold-glow);}
    50%{box-shadow:0 0 28px rgba(255,215,0,0.5);}
}
.bot-avatar img.ai-logo { width:100%;height:100%;object-fit:contain;border-radius:50%;display:block; }
.bot-info { flex:1; }
.bot-info h2 { font-family:'Cinzel',serif;font-size:1.3rem;font-weight:700;color:#fff;letter-spacing:0.05em; }
.gold-text { color:var(--gold);text-shadow:0 0 12px rgba(255,215,0,0.5); }
.bot-tagline { font-size:0.78rem;color:var(--text-dim);display:flex;align-items:center;gap:6px;margin-top:3px; }
.status-dot {
    display:inline-block;width:7px;height:7px;background:#4ade80;
    border-radius:50%;box-shadow:0 0 6px #4ade80;animation:statusBlink 2.5s ease-in-out infinite;
}
@keyframes statusBlink { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

.header-actions { display:flex;align-items:center;gap:8px; }

.header-btn {
    background:rgba(255,215,0,0.08); color:var(--text-dim);
    width:36px;height:36px; border-radius:50%; border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; font-size:0.85rem; transition:all 0.3s ease;
}
.header-btn:hover { background:rgba(255,80,80,0.15);color:#ff6b6b;border-color:rgba(255,80,80,0.3); }

.home-button {
    background:linear-gradient(135deg,var(--gold),var(--gold-dim));
    color:var(--black); width:40px;height:40px; border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:1rem; text-decoration:none; border:none;
    transition:all 0.3s ease; box-shadow:0 4px 16px var(--gold-glow);
}
.home-button:hover { background:linear-gradient(135deg,var(--gold-light),var(--gold));transform:translateY(-2px);box-shadow:0 6px 22px rgba(255,215,0,0.5); }

/* =========================================================
   MESSAGES AREA
   ========================================================= */
.chat-messages {
    flex:1; padding:20px 16px; overflow-y:auto;
    display:flex; flex-direction:column; gap:16px;
    background:radial-gradient(ellipse 80% 40% at 50% 0%,rgba(255,215,0,0.03) 0%,transparent 60%),var(--black-2);
    scroll-behavior:smooth;
}
.chat-messages::-webkit-scrollbar{width:5px;}
.chat-messages::-webkit-scrollbar-track{background:transparent;}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(255,215,0,0.25);border-radius:3px;}

/* =========================================================
   MESSAGE BUBBLES
   ========================================================= */
.message {
    display:flex; align-items:flex-start;
    max-width:88%; animation:msgIn 0.35s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes msgIn { from{opacity:0;transform:translateY(12px) scale(0.97);} to{opacity:1;transform:translateY(0) scale(1);} }

.user-message { align-self:flex-end; flex-direction:row-reverse; }
.bot-message  { align-self:flex-start; }

.message-wrap { display:flex;flex-direction:column;max-width:calc(100% - 54px); }

.message-content {
    padding:13px 16px; border-radius:16px;
    line-height:1.65; font-size:0.93rem;
    word-wrap:break-word; overflow-wrap:break-word;
}
.user-message .message-content {
    background:linear-gradient(135deg,#1a3a6e,#1e4080); color:#dce8ff;
    border-bottom-right-radius:4px; border:1px solid rgba(100,150,255,0.2);
}
.bot-message .message-content {
    background:var(--black-3); color:var(--text);
    border-bottom-left-radius:4px; border:1px solid var(--border);
    box-shadow:0 2px 12px rgba(0,0,0,0.3);
}

/* Markdown styles inside messages */
.message-content p { margin-bottom:8px; }
.message-content p:last-child { margin-bottom:0; }
.message-content strong { color:var(--gold-light);font-weight:600; }
.user-message .message-content strong { color:#b8d4ff; }
.message-content em { font-style:italic;opacity:0.85; }
.message-content ul { padding-left:18px;margin:6px 0; }
.message-content li { margin-bottom:4px;list-style:disc; }
.message-content code.inline-code {
    background:rgba(255,215,0,0.12); color:var(--gold-light);
    padding:2px 6px; border-radius:4px; font-size:0.85em; font-family:monospace;
}
.message-content pre {
    background:rgba(0,0,0,0.5); border:1px solid var(--border);
    border-radius:8px; padding:12px; overflow-x:auto; margin:8px 0;
}
.message-content pre code { font-family:monospace;font-size:0.85em;color:#a8e6cf; }

/* Timestamps */
.message-time {
    font-size:0.68rem; color:var(--text-dim);
    margin-top:4px; padding:0 4px;
}
.user-message .message-time { text-align:right; }
.bot-message  .message-time { text-align:left; }

/* =========================================================
   QUICK REPLIES
   ========================================================= */
.quick-replies {
    display:flex; flex-wrap:wrap; gap:8px;
    padding:4px 0 8px 54px;
    animation:msgIn 0.4s ease both;
}
.quick-reply-btn {
    background:rgba(255,215,0,0.06); color:var(--gold);
    border:1px solid rgba(255,215,0,0.3); border-radius:20px;
    padding:7px 14px; font-size:0.82rem; cursor:pointer;
    font-family:'Inter',sans-serif; transition:all 0.25s ease;
    white-space:nowrap;
}
.quick-reply-btn:hover {
    background:rgba(255,215,0,0.15); border-color:var(--gold);
    transform:translateY(-2px); box-shadow:0 4px 12px rgba(255,215,0,0.2);
}

/* =========================================================
   SCROLL TO BOTTOM BUTTON
   ========================================================= */
.scroll-bottom-btn {
    position:absolute; bottom:130px; right:16px;
    width:36px;height:36px; border-radius:50%;
    background:linear-gradient(135deg,var(--gold),var(--gold-dim));
    color:var(--black); border:none; cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:0.9rem; box-shadow:0 4px 14px var(--gold-glow);
    transition:opacity 0.3s ease,transform 0.3s ease; z-index:10;
}
.scroll-bottom-btn:hover { transform:translateY(-2px); }

/* =========================================================
   TYPING INDICATOR
   ========================================================= */
.typing-indicator {
    display:flex; align-items:center; gap:10px;
    padding:10px 16px; flex-shrink:0;
}
.typing-avatar {
    width:38px;height:38px;min-width:38px; border-radius:50%; overflow:hidden;
    border:2px solid var(--gold); box-shadow:0 0 10px var(--gold-glow);
    background:#1a1400; padding:2px;
    display:flex;align-items:center;justify-content:center;
}
.typing-dots {
    background:var(--black-3); border:1px solid var(--border);
    border-radius:14px; padding:9px 14px;
    display:flex; gap:5px; align-items:center;
}
.typing-dots span {
    display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--gold);animation:typingBounce 1.3s infinite ease-in-out both;
}
.typing-dots span:nth-child(1){animation-delay:-0.32s;}
.typing-dots span:nth-child(2){animation-delay:-0.16s;}
@keyframes typingBounce { 0%,80%,100%{transform:scale(0.4);opacity:0.4;} 40%{transform:scale(1);opacity:1;} }
.typing-label { font-size:0.75rem;color:var(--text-dim);font-style:italic; }

/* =========================================================
   INPUT AREA
   ========================================================= */
.input-area {
    padding:14px 16px; border-top:1px solid var(--border);
    display:flex; gap:10px; background:var(--black-1);
    align-items:center; flex-shrink:0;
}
.input-area input {
    flex:1; padding:13px 18px; border:1.5px solid rgba(255,215,0,0.2);
    border-radius:50px; background:var(--black-3); color:var(--text);
    font-size:0.95rem; outline:none; transition:all 0.3s ease;
    font-family:'Inter',sans-serif;
}
.input-area input::placeholder { color:var(--text-dim); }
.input-area input:focus { border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,215,0,0.1);background:var(--black-4); }
.input-area input:disabled { opacity:0.5;cursor:not-allowed; }
.input-area button {
    background:linear-gradient(135deg,var(--gold),var(--gold-dim)); color:var(--black);
    border:none; width:48px;height:48px;min-width:48px; border-radius:50%;
    font-size:1rem; cursor:pointer; transition:all 0.3s ease;
    box-shadow:0 4px 16px var(--gold-glow);
    display:flex;align-items:center;justify-content:center;
}
.input-area button:hover { background:linear-gradient(135deg,var(--gold-light),var(--gold));transform:translateY(-2px) scale(1.05);box-shadow:0 6px 22px rgba(255,215,0,0.5); }
.input-area button:active { transform:scale(0.97); }
.input-area button:disabled { opacity:0.5;cursor:not-allowed;transform:none; }

/* =========================================================
   FOOTER
   ========================================================= */
.chat-footer {
    padding:8px 16px; text-align:center; color:var(--text-dim);
    font-size:0.72rem; background:var(--black-1);
    border-top:1px solid rgba(255,215,0,0.08); letter-spacing:0.02em; flex-shrink:0;
}
.chat-footer i { color:var(--gold);margin-right:4px; }

/* =========================================================
   LINKS & ACCESSIBILITY
   ========================================================= */
.chat-link { color:var(--gold);text-decoration:underline;word-break:break-all;transition:color 0.2s; }
.chat-link:hover { color:var(--gold-light);text-decoration:none; }
a:focus,button:focus,input:focus { outline:2px solid var(--gold);outline-offset:2px; }
*{ -webkit-tap-highlight-color:transparent; }

/* =========================================================
   RESPONSIVE — MOBILE
   ========================================================= */
@media (max-width:768px) {
    body { padding:0; align-items:flex-start; }
    .chat-container {
        width:100%; border-radius:0; border:none;
        height:100vh; height:calc(var(--vh,1vh)*100); max-width:100%;
    }
    .chat-header { padding:12px 14px; }
    .bot-avatar { width:44px;height:44px;min-width:44px; }
    .bot-info h2 { font-size:1.1rem; }
    .chat-messages { padding:14px 12px; gap:12px; }
    .message { max-width:92%; }
    .message-content { padding:11px 13px;font-size:0.9rem; }
    .input-area { padding:10px 12px;gap:8px; }
    .input-area input { padding:11px 14px;font-size:15px; }
    .input-area button { width:44px;height:44px;min-width:44px;font-size:0.95rem; }
    .quick-replies { padding-left:10px; }
    .quick-reply-btn { font-size:0.78rem;padding:6px 12px; }
    .splash-title { font-size:2rem; }
    .splash-logo-wrap { width:80px;height:80px; }
    .splash-ring-1{width:110px;height:110px;}
    .splash-ring-2{width:135px;height:135px;}
    .splash-ring-3{width:160px;height:160px;}
    .scroll-bottom-btn { bottom:110px;right:12px; }
}

@media (max-width:480px) {
    .message { max-width:96%; }
    .message-content { padding:10px 11px;font-size:0.87rem; }
    .bot-info .bot-tagline { display:none; }
}

/* Safe area for iPhone notch */
@supports(padding:max(0px)) {
    .input-area { padding-bottom:max(14px, env(safe-area-inset-bottom)); }
}


/* Reset and Base Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    /* GLOWING GOLDEN THEME */
    --bg-primary: #000000;
    --bg-secondary: #0a0a0a;
    --bg-tertiary: #111111;
    --text-primary: #ffffff;
    --text-secondary: #e6e6e6;
    --text-muted: #aaaaaa;

    /* GLOWING GOLD COLORS */
    --accent-color: #ffd700;
    --accent-glow: #ffed4e;
    --accent-hover: #fff9c4;
    --gold-shadow: rgba(255, 215, 0, 0.5);

    --border-color: #222222;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    --transition: all 0.3s ease;
    --border-radius: 12px;
    --container-width: 1200px;
}

/* Light Theme Variables */
.light-theme {
    --bg-primary: #f5f5f5;
    --bg-secondary: #ffffff;
    --bg-tertiary: #f0f0f0;
    --text-primary: #222222;
    --text-secondary: #444444;
    --text-muted: #666666;
    --accent-color: #d4af37;
    --accent-glow: #e6c158;
    --accent-hover: #f8d568;
    --gold-shadow: rgba(212, 175, 55, 0.4);
    --border-color: #dddddd;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    transition: var(--transition);
}

.container {
    max-width: var(--container-width);
    margin: 0 auto;
    padding: 0 20px;
}

/* Typography */
h1, h2, h3, h4 {
    font-weight: 700;
    line-height: 1.2;
}

.highlight {
    color: var(--accent-color);
}

/* Buttons */
.btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    border-radius: var(--border-radius);
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    border: none;
    cursor: pointer;
    transition: var(--transition);
}

.btn-primary {
    background-color: var(--accent-color);
    color: white;
}

.btn-primary:hover {
    background-color: var(--accent-hover);
    transform: translateY(-3px);
}

.btn-secondary {
    background-color: transparent;
    color: var(--accent-color);
    border: 2px solid var(--accent-color);
}

.btn-secondary:hover {
    background-color: var(--accent-color);
    color: white;
    transform: translateY(-3px);
}

/* Navigation */
.navbar {
    background-color: var(--bg-secondary);
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 1000;
    box-shadow: var(--shadow);
    padding: 20px 0;
}

.nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text-primary);
    font-size: 1.5rem;
    font-weight: 700;
}

.logo i {
    color: var(--accent-color);
    font-size: 1.8rem;
}

.nav-menu {
    display: flex;
    list-style: none;
    gap: 30px;
    align-items: center;
}

.nav-menu a {
    color: var(--text-secondary);
    text-decoration: none;
    font-weight: 500;
    transition: var(--transition);
    padding: 8px 0;
    position: relative;
}

.nav-menu a:hover,
.nav-menu a.active {
    color: var(--accent-color);
}

.nav-menu a.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background-color: var(--accent-color);
}

.theme-toggle {
    background: none;
    border: none;
    color: var(--text-primary);
    font-size: 1.3rem;
    cursor: pointer;
    transition: var(--transition);
    padding: 8px;
    border-radius: 50%;
}

.theme-toggle:hover {
    background-color: var(--bg-tertiary);
}

.menu-toggle {
    display: none;
    background: none;
    border: none;
    color: var(--text-primary);
    font-size: 1.5rem;
    cursor: pointer;
}

/* Hero Section */
.hero {
    padding: 180px 0 100px;
    background: transparent;
    position: relative;
    overflow: hidden;
}

.hero-content {
    max-width: 800px;
    margin-bottom: 60px;
}

.hero-title {
    font-size: 3.5rem;
    margin-bottom: 20px;
}

.hero-subtitle {
    font-size: 1.3rem;
    color: var(--text-secondary);
    margin-bottom: 40px;
    max-width: 600px;
}

.hero-buttons {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.hero-stats {
    display: flex;
    gap: 50px;
    padding-top: 40px;
    border-top: 1px solid var(--border-color);
}

.stat h3 {
    font-size: 2.5rem;
    color: var(--accent-color);
    margin-bottom: 5px;
}

.stat p {
    color: var(--text-secondary);
}

/* Section Common Styles */
section {
    padding: 100px 0;
}

.section-header {
    text-align: center;
    margin-bottom: 60px;
}

.section-title {
    font-size: 2.5rem;
    margin-bottom: 15px;
}

.section-subtitle {
    color: var(--text-secondary);
    font-size: 1.2rem;
    max-width: 600px;
    margin: 0 auto;
}

/* Blog Section */
.blog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 30px;
    margin-bottom: 50px;
}

.blog-card {
    background-color: var(--bg-secondary);
    border-radius: var(--border-radius);
    overflow: hidden;
    transition: var(--transition);
    border: 1px solid var(--border-color);
}

.blog-card:hover {
    transform: translateY(-10px);
    box-shadow: var(--shadow);
    border-color: var(--accent-color);
}

.blog-card-header {
    position: relative;
    height: 200px;
    overflow: hidden;
}

.blog-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: var(--transition);
}

.blog-card:hover .blog-image {
    transform: scale(1.05);
}

.blog-category {
    position: absolute;
    top: 20px;
    right: 20px;
    background-color: var(--accent-color);
    color: white;
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 0.9rem;
    font-weight: 600;
}

.blog-card-body {
    padding: 25px;
}

.blog-title {
    font-size: 1.4rem;
    margin-bottom: 15px;
    color: var(--text-primary);
}

.blog-excerpt {
    color: var(--text-secondary);
    margin-bottom: 20px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.blog-meta {
    display: flex;
    gap: 20px;
    color: var(--text-muted);
    font-size: 0.9rem;
}

.blog-meta i {
    margin-right: 5px;
}

.blog-card-footer {
    padding: 0 25px 25px;
}

.read-more {
    color: var(--accent-color);
    text-decoration: none;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: var(--transition);
}

.read-more:hover {
    gap: 12px;
}

.view-all-container {
    text-align: center;
}

/* About Section */
.about-content {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 50px;
    align-items: center;
}

.about-image {
    position: relative;
}

.about-image img {
    width: 100%;
    border-radius: var(--border-radius);
    box-shadow: var(--shadow);
}

.about-text h3 {
    font-size: 2rem;
    margin-bottom: 20px;
}

.about-text p {
    color: var(--text-secondary);
    margin-bottom: 15px;
}

.skill-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
}

.skill-tag {
    background-color: var(--bg-tertiary);
    color: var(--accent-color);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 0.9rem;
    border: 1px solid var(--accent-color);
}

/* Contact Section */
.contact-content {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 50px;
}

.contact-info h3 {
    font-size: 1.8rem;
    margin-bottom: 30px;
}

.contact-item {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
    align-items: flex-start;
}

.contact-item i {
    color: var(--accent-color);
    font-size: 1.5rem;
    margin-top: 5px;
}

.contact-item h4 {
    margin-bottom: 5px;
}

.contact-item p {
    color: var(--text-secondary);
}

.social-links {
    margin-top: 40px;
}

.social-links h4 {
    margin-bottom: 20px;
}

.social-icons {
    display: flex;
    gap: 15px;
}

.social-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 45px;
    height: 45px;
    background-color: var(--bg-tertiary);
    border-radius: 50%;
    color: var(--text-primary);
    font-size: 1.2rem;
    transition: var(--transition);
    border: 1px solid var(--border-color);
    text-decoration: none;
}

.social-icon:hover {
    background-color: var(--accent-color);
    color: white;
    transform: translateY(-3px);
}

/* Contact Form */
.contact-form {
    background-color: var(--bg-secondary);
    padding: 40px;
    border-radius: var(--border-radius);
    border: 1px solid var(--border-color);
}

.form-group {
    margin-bottom: 25px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: var(--text-secondary);
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 14px;
    background-color: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    transition: var(--transition);
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: var(--accent-color);
    outline: none;
    box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
}

/* Footer */
.footer {
    background-color: var(--bg-secondary);
    padding: 60px 0 30px;
    border-top: 1px solid var(--border-color);
}

.footer-content {
    display: grid;
    grid-template-columns: 2fr 1fr 2fr;
    gap: 50px;
    margin-bottom: 40px;
}

.footer-logo p {
    color: var(--text-secondary);
    margin-top: 15px;
    max-width: 300px;
}

.footer-links h4,
.footer-newsletter h4 {
    margin-bottom: 20px;
    font-size: 1.1rem;
}

.footer-links ul {
    list-style: none;
}

.footer-links ul li {
    margin-bottom: 10px;
}

.footer-links ul li a {
    color: var(--text-secondary);
    text-decoration: none;
    transition: var(--transition);
}

.footer-links ul li a:hover {
    color: var(--accent-color);
}

.footer-newsletter p {
    color: var(--text-secondary);
    margin-bottom: 20px;
}

.newsletter-form {
    display: flex;
    gap: 10px;
}

.newsletter-form input {
    flex: 1;
    padding: 12px;
    background-color: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    color: var(--text-primary);
    font-size: 0.9rem;
}

.newsletter-form button {
    padding: 12px 20px;
    background-color: var(--accent-color);
    color: white;
    border: none;
    border-radius: var(--border-radius);
    cursor: pointer;
    transition: var(--transition);
}

.newsletter-form button:hover {
    background-color: var(--accent-hover);
}

.footer-bottom {
    padding-top: 30px;
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-muted);
    font-size: 0.9rem;
}

/* Back to Top */
.back-to-top {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 50px;
    height: 50px;
    background-color: var(--accent-color);
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.2rem;
    display: none;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    z-index: 999;
    box-shadow: 0 5px 15px var(--gold-shadow);
}

.back-to-top:hover {
    transform: translateY(-5px);
    background-color: var(--accent-hover);
}

/* Responsive Design */
@media (max-width: 992px) {
    .footer-content {
        grid-template-columns: 1fr 1fr;
    }

    .footer-logo {
        grid-column: 1 / -1;
    }
}

@media (max-width: 768px) {
    .menu-toggle {
        display: block;
    }

    .nav-menu {
        position: fixed;
        top: 70px;
        left: 0;
        width: 100%;
        background-color: var(--bg-secondary);
        flex-direction: column;
        gap: 0;
        padding: 20px 0;
        transform: translateX(-100%);
        transition: var(--transition);
        z-index: 999;
        box-shadow: var(--shadow);
    }

    .nav-menu.active {
        transform: translateX(0);
    }

    .nav-menu li {
        width: 100%;
    }

    .nav-menu a {
        display: block;
        padding: 15px 30px;
    }

    .theme-toggle-container {
        padding: 10px 30px;
    }

    .hero {
        padding: 120px 0 60px;
    }

    .hero-title {
        font-size: 2.5rem;
    }

    .hero-stats {
        gap: 30px;
        flex-wrap: wrap;
    }

    .about-content {
        grid-template-columns: 1fr;
    }

    .contact-content {
        grid-template-columns: 1fr;
    }

    .footer-content {
        grid-template-columns: 1fr;
    }

    .footer-bottom {
        flex-direction: column;
        gap: 10px;
        text-align: center;
    }
}

@media (max-width: 480px) {
    .hero-title {
        font-size: 2rem;
    }

    .section-title {
        font-size: 2rem;
    }

    .blog-grid {
        grid-template-columns: 1fr;
    }

    .contact-form {
        padding: 20px;
    }
}

/* Custom Logo */
.custom-logo {
    width: 55px;
    height: 55px;
    object-fit: contain;
    margin-right: 12px;
    border-radius: 10px;
    transition: all 0.3s ease;
}

.logo:hover .custom-logo {
    transform: scale(1.08);
}

.navbar .logo img {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #ffd700;
    margin-right: 15px;
    transition: all 0.3s ease;
}

.navbar .logo img:hover {
    transform: rotate(10deg);
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
}

.nav-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    vertical-align: middle;
    margin-right: 10px;
    border: 2px solid #ffd700;
}

/* Footer AI Link Styling */
.footer-ai-icon {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #ffd700;
    object-fit: cover;
    margin-right: 8px;
    vertical-align: middle;
}

.ai-link {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #ffd700;
    font-weight: 600;
}

.ai-link:hover {
    color: #ffd700;
}

.ai-link:hover .footer-ai-icon {
    transform: scale(1.1);
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
}

.footer-links ul li {
    display: flex;
    align-items: center;
    height: 40px;
}

.footer-link, .ai-link {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    height: 100%;
}

.ai-link {
    display: flex;
    align-items: center;
    gap: 8px;
}

@media (max-width: 768px) {
    .hero-content h1 {
        font-size: 1.8rem !important;
        margin-bottom: 10px !important;
    }

    .hero-title .highlight {
        font-size: 1.8rem !important;
        display: inline !important;
    }

    .hero-subtitle {
        font-size: 0.95rem !important;
        line-height: 1.4 !important;
        margin-bottom: 20px !important;
        max-width: 95% !important;
    }
}

/* ====== GLOWING GOLDEN EFFECTS ====== */
.btn-primary {
    background: linear-gradient(135deg, #ffd700, #ffed4e);
    color: #000000 !important;
    font-weight: 700;
    border: none;
    box-shadow:
        0 0 15px var(--gold-shadow),
        0 5px 20px rgba(255, 215, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.2);
    position: relative;
    overflow: hidden;
}

.btn-primary:hover {
    background: linear-gradient(135deg, #ffed4e, #fff9c4);
    box-shadow:
        0 0 25px rgba(255, 237, 78, 0.7),
        0 8px 25px rgba(255, 215, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    transform: translateY(-3px);
}

@keyframes gold-pulse {
    0%, 100% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
    50% { box-shadow: 0 0 25px rgba(255, 237, 78, 0.8); }
}

.btn-primary {
    animation: gold-pulse 3s infinite;
}

.nav-menu a {
    position: relative;
}

.nav-menu a:hover,
.nav-menu a.active {
    color: var(--accent-glow);
    text-shadow: 0 0 10px rgba(255, 237, 78, 0.8);
}

.nav-menu a.active::after {
    background: linear-gradient(90deg, transparent, #ffd700, transparent);
    height: 3px;
    bottom: -5px;
    box-shadow: 0 0 10px #ffd700;
}

.hero-title .highlight {
    color: #ffd700;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.7);
    animation: text-glow 2s infinite alternate;
    background: none !important;
}

@keyframes text-glow {
    from { text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
    to { text-shadow: 0 0 30px rgba(255, 237, 78, 0.9); }
}

.blog-card, .contact-item, .skill-tag {
    border: 1px solid #222222;
    background: var(--bg-tertiary);
    transition: all 0.3s ease;
    position: relative;
}

.blog-card:hover, .contact-item:hover {
    border-color: #ffd700;
    box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.8),
        0 0 15px rgba(255, 215, 0, 0.3);
}

a:not(.btn) {
    color: var(--accent-color);
    text-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
    transition: all 0.3s ease;
}

a:not(.btn):hover {
    color: var(--accent-glow);
    text-shadow: 0 0 15px rgba(255, 237, 78, 0.8);
}

.fa-moon, .fa-laptop-code, .fa-robot,
.fa-book-reader, .fa-paper-plane,
.fa-home, .fa-sun, .fa-user, .fa-arrow-right {
    color: var(--accent-color);
    filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.6));
    transition: all 0.3s ease;
}

.fa-moon:hover, .fa-laptop-code:hover, .fa-robot:hover {
    color: var(--accent-glow);
    filter: drop-shadow(0 0 10px rgba(255, 237, 78, 0.9));
}

::-webkit-scrollbar-thumb {
    background: linear-gradient(to bottom, #ffd700, #ffed4e);
    border-radius: 10px;
    box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.3);
}

input:focus, textarea:focus {
    border-color: #ffd700;
    box-shadow:
        0 0 10px rgba(255, 215, 0, 0.4),
        inset 0 0 5px rgba(255, 215, 0, 0.2);
    outline: none;
}

::selection {
    background-color: rgba(255, 215, 0, 0.5);
    color: #000000;
    text-shadow: none;
}

.hero-stats .stat h3 {
    color: #ffd700;
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
    font-weight: 800;
}

.typewriter-text {
    border-right: 3px solid #ffd700;
    box-shadow: 0 0 10px #ffd700;
}

.hero-title .highlight {
    background: transparent !important;
    background-color: transparent !important;
    -webkit-background-clip: unset !important;
    background-clip: unset !important;
}

.hero-title {
    background: none !important;
    -webkit-text-fill-color: unset !important;
}

@media (max-width: 768px) {

    .stat-label {

    .banner-nav {

    }

    .banner-menu {

html, body {
    overflow-x: hidden;
    max-width: 100%;
}

/* ====================================================
   FEATURE 1: LOADING SCREEN
   ==================================================== */
#rj-loader {
    position: fixed;
    inset: 0;
    background: #000000;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    transition: opacity 0.6s ease, visibility 0.6s ease;
}

#rj-loader.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.loader-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    animation: loaderPulse 1.5s ease-in-out infinite;
}

@keyframes loaderPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6)); }
    50%       { transform: scale(1.06); filter: drop-shadow(0 0 40px rgba(255, 237, 78, 1)); }
}

.loader-logo img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid #ffd700;
    object-fit: cover;
}

.loader-logo span {
    font-family: 'Inter', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    color: #ffd700;
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
}

.loader-tagline {
    font-size: 0.95rem;
    color: #aaaaaa;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* Animated gold bar under logo */
.loader-bar-track {
    width: 220px;
    height: 3px;
    background: #1a1a1a;
    border-radius: 10px;
    overflow: hidden;
}

.loader-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffd700, #ffed4e, #ffd700);
    background-size: 200% 100%;
    border-radius: 10px;
    animation: loaderFill 1.8s ease forwards, shimmer 1s linear infinite;
}

@keyframes loaderFill {
    0%   { width: 0%; }
    100% { width: 100%; }
}

@keyframes shimmer {
    0%   { background-position: 200% center; }
    100% { background-position: -200% center; }
}

/* ====================================================
   FEATURE 2: SCROLL PROGRESS BAR
   ==================================================== */
#scroll-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 3px;
    width: 0%;
    background: linear-gradient(90deg, #ffd700, #ffed4e, #fff9c4);
    z-index: 99998;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.4);
    transition: width 0.1s linear;
    border-radius: 0 2px 2px 0;
}

/* Glowing tip at the end of the bar */
#scroll-progress::after {
    content: '';
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 8px;
    height: 8px;
    background: #ffed4e;
    border-radius: 50%;
    box-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700;
}

/* ====================================================
   FEATURE 3: SCROLL REVEAL ANIMATIONS
   ==================================================== */

/* Initial hidden state for all reveal elements */
.reveal {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.7s ease, transform 0.7s ease;
}

.reveal.reveal-left {
    transform: translateX(-50px);
}

.reveal.reveal-right {
    transform: translateX(50px);
}

.reveal.reveal-scale {
    transform: scale(0.9);
}

/* Visible state — added by JS when element enters viewport */
.reveal.visible {
    opacity: 1;
    transform: translateY(0) translateX(0) scale(1);
}

/* Staggered delay for child elements (blog cards, stat items etc.) */
.reveal-child:nth-child(1) { transition-delay: 0s; }
.reveal-child:nth-child(2) { transition-delay: 0.15s; }
.reveal-child:nth-child(3) { transition-delay: 0.3s; }
.reveal-child:nth-child(4) { transition-delay: 0.45s; }
.reveal-child:nth-child(5) { transition-delay: 0.6s; }
.reveal-child:nth-child(6) { transition-delay: 0.75s; }

/* ====== GOLDEN EXPERTISE TAGS ====== */
.skill-tag {
    background: linear-gradient(135deg, #ffd700, #ffed4e) !important;
    color: #000000 !important;
    border: none !important;
    padding: 10px 20px !important;
    border-radius: 25px !important;
    font-weight: 700 !important;
    font-size: 0.95rem !important;
    text-transform: uppercase !important;
    letter-spacing: 1px !important;
    box-shadow:
        0 4px 15px rgba(255, 215, 0, 0.3),
        0 0 10px rgba(255, 215, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.4) !important;
    transition: all 0.3s ease !important;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.2) !important;
    position: relative !important;
    overflow: hidden !important;
}

@keyframes tag-glow {
    0%, 100% {
        box-shadow:
            0 4px 15px rgba(255, 215, 0, 0.3),
            0 0 10px rgba(255, 215, 0, 0.2),
            inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
    50% {
        box-shadow:
            0 4px 20px rgba(255, 215, 0, 0.5),
            0 0 15px rgba(255, 237, 78, 0.4),
            inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }
}

.skill-tag { animation: tag-glow 3s infinite ease-in-out !important; }
.skill-tag:nth-child(1) { animation-delay: 0s; }
.skill-tag:nth-child(2) { animation-delay: 0.2s; }
.skill-tag:nth-child(3) { animation-delay: 0.4s; }
.skill-tag:nth-child(4) { animation-delay: 0.6s; }
.skill-tag:nth-child(5) { animation-delay: 0.8s; }
.skill-tag:nth-child(6) { animation-delay: 1s; }

.skill-tag:hover {
    transform: translateY(-5px) scale(1.05) !important;
    background: linear-gradient(135deg, #ffed4e, #fff9c4) !important;
    box-shadow:
        0 8px 25px rgba(255, 215, 0, 0.5),
        0 0 20px rgba(255, 237, 78, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.6) !important;
    animation-play-state: paused !important;
}

.skill-tag::before,
.skill-tag::after {
    content: '';
    position: absolute;
    width: 15px;
    height: 15px;
    border: 2px solid rgba(255, 215, 0, 0.5);
    opacity: 0.3;
}

.skill-tag::before {
    top: 5px;
    left: 5px;
    border-right: none;
    border-bottom: none;
}

.skill-tag::after {
    bottom: 5px;
    right: 5px;
    border-left: none;
    border-top: none;
}

@media (max-width: 768px) {
    .skill-tag {
        padding: 8px 16px !important;
        font-size: 0.85rem !important;
        letter-spacing: 0.5px !important;
    }

    .skill-tag::before,
    .skill-tag::after {
        width: 10px;
        height: 10px;
    }
}

.skills h4 {
    color: #ffd700 !important;
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.5) !important;
    margin-bottom: 20px !important;
    font-size: 1.5rem !important;
}

.skills {
    padding: 20px;
    border-radius: 15px;
    background: rgba(0, 0, 0, 0.1);
    border: 1px solid rgba(255, 215, 0, 0.1);
}

/* ============================================================
   ONYX APP — Shared UI Layer
   Bottom Nav · Auth Drawer · Profile Page · Notifications
   Bookmarks · Floating Syncro Bubble · Page Transitions
   ============================================================ */

/* ── BOTTOM NAV ─────────────────────────────────────────── */
.onyx-bottom-nav {
    display: none; /* shown only on mobile */
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 64px;
    background: rgba(10,10,10,0.97);
    border-top: 1px solid rgba(255,215,0,0.18);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    z-index: 9000;
    align-items: center;
    justify-content: space-around;
    padding: 0 4px;
    padding-bottom: env(safe-area-inset-bottom);
    box-shadow: 0 -4px 24px rgba(0,0,0,0.6), 0 -1px 0 rgba(255,215,0,0.08);
}

.onyx-nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    text-decoration: none;
    color: #666;
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    position: relative;
    padding: 6px 0;
    transition: color 0.2s ease;
    cursor: pointer;
    border: none;
    background: none;
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
}

.onyx-nav-item i {
    font-size: 1.25rem;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), color 0.2s ease;
}

.onyx-nav-item.active {
    color: #ffd700;
}

.onyx-nav-item.active i {
    color: #ffd700;
    filter: drop-shadow(0 0 6px rgba(255,215,0,0.7));
    transform: translateY(-3px) scale(1.15);
}

/* Active pip */
.onyx-nav-item.active::after {
    content: '';
    position: absolute;
    bottom: 2px;
    width: 4px; height: 4px;
    background: #ffd700;
    border-radius: 50%;
    box-shadow: 0 0 6px #ffd700;
    animation: navPip 0.3s ease both;
}

@keyframes navPip {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
}

/* Tap ripple */
.onyx-nav-item::before {
    content: '';
    position: absolute;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,215,0,0.1);
    transform: scale(0);
    transition: transform 0.3s ease, opacity 0.3s ease;
    opacity: 0;
}

.onyx-nav-item:active::before {
    transform: scale(1.4);
    opacity: 1;
}

/* Notification badge on nav item */
.onyx-nav-badge {
    position: absolute;
    top: 4px; right: 14px;
    min-width: 16px; height: 16px;
    background: #ff4444;
    color: #fff;
    font-size: 0.6rem;
    font-weight: 700;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 3px;
    border: 1.5px solid #000;
    animation: badgePop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
}

@keyframes badgePop {
    from { transform: scale(0); }
    to   { transform: scale(1); }
}

/* ── BOTTOM NAV MOBILE ONLY ──────────────────────────────── */
@media (max-width: 768px) {
    .onyx-bottom-nav { display: flex; }

    /* Push page content above bottom nav */
    body { padding-bottom: 70px !important; }

    /* Hide top hamburger menu on mobile — bottom nav replaces it */
    .menu-toggle { display: none !important; }
    .nav-menu    { display: none !important; }

    /* Hide old back-to-top on mobile (bottom nav covers it) */
    .back-to-top { bottom: 80px !important; right: 16px !important; }
}

/* ── SIDE DRAWER (hamburger menu / profile options) ─────── */
.onyx-drawer-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 9100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.onyx-drawer-overlay.open {
    opacity: 1;
    pointer-events: all;
}

.onyx-drawer {
    position: fixed;
    top: 0; right: -320px;
    width: 300px;
    height: 100%;
    background: linear-gradient(160deg, #0d0d0d 0%, #111108 100%);
    border-left: 1px solid rgba(255,215,0,0.15);
    z-index: 9200;
    display: flex;
    flex-direction: column;
    transition: right 0.35s cubic-bezier(0.22,1,0.36,1);
    box-shadow: -8px 0 40px rgba(0,0,0,0.8);
    padding-bottom: env(safe-area-inset-bottom);
}

.onyx-drawer.open { right: 0; }

/* Drawer top bar */
.drawer-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 20px 16px;
    border-bottom: 1px solid rgba(255,215,0,0.1);
}

.drawer-brand {
    display: flex; align-items: center; gap: 10px;
}

.drawer-brand img {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 2px solid #ffd700;
    object-fit: cover;
}

.drawer-brand span {
    font-weight: 700;
    font-size: 1.1rem;
    color: #ffd700;
    letter-spacing: 0.08em;
}

.drawer-close {
    background: rgba(255,215,0,0.08);
    border: 1px solid rgba(255,215,0,0.2);
    color: #aaa;
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s ease;
}

.drawer-close:hover { background: rgba(255,80,80,0.15); color: #ff6b6b; border-color: rgba(255,80,80,0.3); }

/* Drawer user section */
.drawer-user {
    padding: 20px;
    border-bottom: 1px solid rgba(255,215,0,0.08);
}

.drawer-user-avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 2.5px solid #ffd700;
    box-shadow: 0 0 20px rgba(255,215,0,0.3);
    object-fit: cover;
    margin-bottom: 12px;
    background: #111;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem;
    overflow: hidden;
    animation: avatarGlow 3s ease-in-out infinite;
}

@keyframes avatarGlow {
    0%,100% { box-shadow: 0 0 20px rgba(255,215,0,0.3); }
    50%      { box-shadow: 0 0 35px rgba(255,215,0,0.55); }
}

.drawer-user-name {
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 2px;
}

.drawer-user-email {
    font-size: 0.78rem;
    color: #888;
}

/* Drawer menu items */
.drawer-menu {
    flex: 1;
    padding: 12px 0;
    overflow-y: auto;
}

.drawer-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    color: #ccc;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: 'Inter', sans-serif;
    transition: all 0.2s ease;
    border-left: 3px solid transparent;
    position: relative;
    overflow: hidden;
}

.drawer-item::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(255,215,0,0.06) 0%, transparent 100%);
    opacity: 0;
    transition: opacity 0.2s ease;
}

.drawer-item:hover {
    color: #ffd700;
    border-left-color: #ffd700;
}

.drawer-item:hover::after { opacity: 1; }

.drawer-item i {
    width: 20px;
    text-align: center;
    font-size: 1rem;
    color: #ffd700;
    opacity: 0.7;
    transition: opacity 0.2s ease;
}

.drawer-item:hover i { opacity: 1; }

.drawer-separator {
    height: 1px;
    background: rgba(255,215,0,0.08);
    margin: 8px 20px;
}

.drawer-item.danger { color: #ff6b6b; }
.drawer-item.danger i { color: #ff6b6b; }
.drawer-item.danger:hover { border-left-color: #ff6b6b; color: #ff9999; }

/* Theme toggle inside drawer */
.drawer-theme-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-left: 3px solid transparent;
}

.drawer-theme-row span {
    display: flex; align-items: center; gap: 14px;
    color: #ccc; font-size: 0.95rem;
}

.drawer-theme-row span i {
    width: 20px; text-align: center;
    font-size: 1rem; color: #ffd700; opacity: 0.7;
}

.toggle-switch {
    width: 44px; height: 24px;
    background: #222;
    border-radius: 12px;
    border: 1px solid rgba(255,215,0,0.2);
    position: relative;
    cursor: pointer;
    transition: background 0.3s ease;
    flex-shrink: 0;
}

.toggle-switch.on { background: linear-gradient(135deg, #ffd700, #ffed4e); border-color: #ffd700; }

.toggle-knob {
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
}

.toggle-switch.on .toggle-knob { transform: translateX(20px); }

/* ── AUTH MODAL ─────────────────────────────────────────── */
.onyx-auth-modal {
    position: fixed; inset: 0;
    z-index: 9999;
    display: flex; align-items: flex-end; justify-content: center;
    pointer-events: none;
}

.onyx-auth-modal.open { pointer-events: all; }

.auth-backdrop {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    opacity: 0;
    transition: opacity 0.3s ease;
}

.onyx-auth-modal.open .auth-backdrop { opacity: 1; }

.auth-sheet {

    width: 100%;
    max-width: 480px;
    background: linear-gradient(160deg, #0d0d0d, #110f00);
    border: 1px solid rgba(255,215,0,0.18);

    border-radius: 24px 24px 0 0;
    padding: 32px 28px 40px;

    transition: transform 0.45s cubic-bezier(0.22,1,0.36,1);

.onyx-auth-modal.open .auth-sheet { transform: translateY(0); }

.auth-handle {

.auth-btn i { font-size: 1.2rem; width: 24px; text-align: center; }
.auth-btn.google i { color: #ea4335; }
.auth-btn.apple  i { color: #fff; }
.auth-btn.email  i { color: #ffd700; }

.auth-divider {

.auth-divider::before, .auth-divider::after {

.auth-email-form.show { display: block; }

.auth-input {

.auth-input:focus {

.auth-submit {

.auth-submit:hover {

/* ── PROFILE PAGE ────────────────────────────────────────── */
.profile-page {
    position: fixed; inset: 0;
    background: #000;
    z-index: 8500;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
    padding-bottom: 80px;
}

.profile-page.open { transform: translateX(0); }

.profile-header {

.profile-back-btn {

.profile-header h2 {

.profile-body {

    animation: profileSlideUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.1s both;

@keyframes profileSlideUp {

.profile-avatar-wrap {

.profile-avatar-img {

.profile-avatar-edit {

.profile-avatar-edit:hover { transform: scale(1.1); }
#profileAvatarInput { display: none; }

.profile-username-display {

    font-weight: 700;
    color: #fff;
    margin-bottom: 2px;

.profile-email-display {
    font-size: 0.8rem;

.profile-field {

.profile-field label {

.profile-input {
    width: 100%;
    padding: 14px 16px;

.profile-input:focus {

.profile-save-btn {

    font-weight: 700;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 4px 16px rgba(255,215,0,0.35);
    margin-bottom: 16px;
    animation: profileSlideUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.3s both;
}

.profile-save-btn:hover {
    background: linear-gradient(135deg, #ffed4e, #fff9c4);
    transform: translateY(-2px);
    box-shadow: 0 6px 22px rgba(255,215,0,0.5);
}

.profile-logout-btn {
    width: 100%;
    padding: 15px;
    background: rgba(255,80,80,0.08);
    color: #ff6b6b;
    font-size: 0.95rem;
    font-weight: 600;
    border: 1px solid rgba(255,80,80,0.25);
    border-radius: 14px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.25s ease;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    animation: profileSlideUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.35s both;
}

.profile-logout-btn:hover {
    background: rgba(255,80,80,0.15);
    border-color: rgba(255,80,80,0.5);
    transform: translateY(-1px);
}

/* Saved posts in profile */
.profile-saved-section {
    margin-top: 32px;
    animation: profileSlideUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.4s both;
}

.profile-saved-section h3 {
    font-size: 0.9rem;
    font-weight: 700;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
}

.profile-saved-section h3 i { color: #ffd700; }

.saved-post-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,215,0,0.08);
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    animation: savedItemIn 0.4s ease both;
}

@keyframes savedItemIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
}

.saved-post-item:hover {
    border-color: rgba(255,215,0,0.25);
    background: rgba(255,215,0,0.04);
    transform: translateX(4px);
}

.saved-post-item img {
    width: 50px; height: 50px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
}

.saved-post-info h4 {
    font-size: 0.85rem;
    color: #ddd;
    margin-bottom: 2px;
    line-height: 1.3;
}

.saved-post-info span {
    font-size: 0.72rem;
    color: #555;
}

.saved-empty {
    text-align: center;
    color: #444;
    font-size: 0.9rem;
    padding: 24px;
}

.saved-empty i { display: block; font-size: 2rem; color: #2a2a2a; margin-bottom: 8px; }

/* ── NOTIFICATIONS PANEL ─────────────────────────────────── */
.onyx-notif-panel {
    position: fixed;
    top: 0; right: -340px;
    width: 320px;
    height: 100%;
    background: linear-gradient(160deg, #0a0a0a, #0e0d00);
    border-left: 1px solid rgba(255,215,0,0.15);
    z-index: 9200;
    display: flex; flex-direction: column;
    transition: right 0.35s cubic-bezier(0.22,1,0.36,1);
    box-shadow: -8px 0 40px rgba(0,0,0,0.8);
    padding-bottom: env(safe-area-inset-bottom);
}

.onyx-notif-panel.open { right: 0; }

.notif-header {
    padding: 20px;
    border-bottom: 1px solid rgba(255,215,0,0.1);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    flex-shrink: 0;
}

.notif-header h3 {
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    display: flex; align-items: center; gap: 8px;
}

.notif-header h3 i { color: #ffd700; }

.notif-clear {
    font-size: 0.75rem;
    color: #ffd700;
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.2s ease;
}

.notif-clear:hover { background: rgba(255,215,0,0.1); }

.notif-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
}

.notif-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,215,0,0.07);
    border-radius: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    animation: notifSlideIn 0.4s cubic-bezier(0.22,1,0.36,1) both;
}

.notif-item:nth-child(1) { animation-delay: 0s; }
.notif-item:nth-child(2) { animation-delay: 0.07s; }
.notif-item:nth-child(3) { animation-delay: 0.14s; }
.notif-item:nth-child(4) { animation-delay: 0.21s; }

@keyframes notifSlideIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
}

.notif-item:hover {
    border-color: rgba(255,215,0,0.2);
    background: rgba(255,215,0,0.04);
}

.notif-item.unread {
    border-left: 3px solid #ffd700;
    background: rgba(255,215,0,0.05);
}

.notif-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,215,0,0.1);
    border: 1px solid rgba(255,215,0,0.2);
    display: flex; align-items: center; justify-content: center;
    color: #ffd700;
    font-size: 0.85rem;
    flex-shrink: 0;
}

.notif-content h4 {
    font-size: 0.82rem;
    font-weight: 600;
    color: #ddd;
    margin-bottom: 2px;
    line-height: 1.3;
}

.notif-content p {
    font-size: 0.75rem;
    color: #666;
    line-height: 1.4;
}

.notif-time {
    font-size: 0.7rem;
    color: #444;
    margin-top: 4px;
}

/* ── FLOATING SYNCRO BUBBLE ──────────────────────────────── */
.syncro-float-btn {
    position: fixed;
    bottom: 80px; right: 20px;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffd700, #ffed4e);
    border: none;
    cursor: pointer;
    z-index: 8000;
    box-shadow: 0 4px 20px rgba(255,215,0,0.5), 0 0 0 0 rgba(255,215,0,0.4);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    animation: floatBubble 4s ease-in-out infinite;
    text-decoration: none;
}

@keyframes floatBubble {
    0%,100% { transform: translateY(0); box-shadow: 0 4px 20px rgba(255,215,0,0.5), 0 0 0 0 rgba(255,215,0,0.4); }
    50%      { transform: translateY(-8px); box-shadow: 0 12px 30px rgba(255,215,0,0.4), 0 0 0 8px rgba(255,215,0,0); }
}

.syncro-float-btn:hover {
    transform: scale(1.12) translateY(-4px);
    animation-play-state: paused;
}

.syncro-float-btn img {
    width: 40px; height: 40px;
    border-radius: 50%;
    object-fit: cover;
}

.syncro-float-tooltip {
    position: absolute;
    right: 64px;
    background: rgba(0,0,0,0.9);
    color: #ffd700;
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255,215,0,0.3);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
}

.syncro-float-btn:hover .syncro-float-tooltip { opacity: 1; }

/* Hide on Syncro page itself */
.syncro-page .syncro-float-btn { display: none; }

/* ── BOOKMARK BUTTON ON BLOG CARDS ──────────────────────── */
.bookmark-btn {
    position: absolute;
    top: 14px; left: 14px;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,215,0,0.25);
    color: rgba(255,215,0,0.6);
    font-size: 0.85rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.25s ease;
    z-index: 5;
}

.bookmark-btn:hover, .bookmark-btn.saved {
    background: rgba(255,215,0,0.15);
    border-color: #ffd700;
    color: #ffd700;
}

.bookmark-btn.saved {
    animation: bookmarkPop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
}

@keyframes bookmarkPop {
    0%  { transform: scale(1); }
    50% { transform: scale(1.4); }
    100%{ transform: scale(1); }
}

/* Blog card needs relative positioning for bookmark button */
.blog-card { position: relative; overflow: hidden; }

/* ── BELL BUTTON (top nav / header) ─────────────────────── */
.notif-bell-btn {
    background: none;
    border: none;
    color: #aaa;
    font-size: 1.2rem;
    cursor: pointer;
    position: relative;
    padding: 8px;
    transition: color 0.2s ease;
    border-radius: 50%;
}

.notif-bell-btn:hover { color: #ffd700; background: rgba(255,215,0,0.08); }

.notif-bell-btn .bell-badge {
    position: absolute;
    top: 4px; right: 4px;
    width: 8px; height: 8px;
    background: #ff4444;
    border-radius: 50%;
    border: 1.5px solid #000;
    animation: badgePulse 2s ease-in-out infinite;
}

@keyframes badgePulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,68,68,0.5); }
    50%      { box-shadow: 0 0 0 4px rgba(255,68,68,0); }
}

/* ── TOAST NOTIFICATION ──────────────────────────────────── */
.onyx-toast {
    position: fixed;
    top: 24px; left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: rgba(20,20,10,0.97);
    border: 1px solid rgba(255,215,0,0.3);
    border-radius: 40px;
    padding: 12px 20px;
    display: flex; align-items: center; gap: 10px;
    color: #fff;
    font-size: 0.88rem;
    font-weight: 500;
    z-index: 99999;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 12px rgba(255,215,0,0.15);
    transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
    white-space: nowrap;
    font-family: 'Inter', sans-serif;
}

.onyx-toast.show { transform: translateX(-50%) translateY(0); }
.onyx-toast i { color: #ffd700; font-size: 1rem; }

/* ── PAGE TRANSITION ANIMATIONS ─────────────────────────── */

/* Home / Hero — scale + fade (epic entrance) */
@keyframes heroSectionIn {
    from { opacity: 0; transform: scale(0.97); }
    to   { opacity: 1; transform: scale(1); }
}

/* Blog cards — stagger slide up with bounce */
@keyframes blogCardIn {
    from { opacity: 0; transform: translateY(50px) rotate(-1deg); }
    to   { opacity: 1; transform: translateY(0) rotate(0deg); }
}

/* About section — slide in from left (personal / storytelling) */
@keyframes aboutSlideIn {
    from { opacity: 0; transform: translateX(-60px); }
    to   { opacity: 1; transform: translateX(0); }
}

/* Contact section — radial reveal (reaching out feel) */
@keyframes contactReveal {
    from { opacity: 0; clip-path: circle(0% at 50% 50%); }
    to   { opacity: 1; clip-path: circle(150% at 50% 50%); }
}

/* Stats — count pop in */
@keyframes statCountIn {
    0%   { opacity: 0; transform: translateY(20px) scale(0.8); }
    60%  { transform: translateY(-4px) scale(1.08); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* Footer — fade up gently */
@keyframes footerFadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* Apply section animations via IntersectionObserver classes */
.section-anim-hero     { animation: heroSectionIn 0.8s cubic-bezier(0.22,1,0.36,1) both; }
.section-anim-blog     { animation: blogCardIn 0.6s cubic-bezier(0.34,1.2,0.64,1) both; }
.section-anim-about    { animation: aboutSlideIn 0.7s cubic-bezier(0.22,1,0.36,1) both; }
.section-anim-contact  { animation: contactReveal 0.8s ease both; }
.section-anim-stat     { animation: statCountIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
.section-anim-footer   { animation: footerFadeUp 0.6s ease both; }

/* Blog card stagger delays */
.blog-card:nth-child(1) { animation-delay: 0s; }
.blog-card:nth-child(2) { animation-delay: 0.12s; }
.blog-card:nth-child(3) { animation-delay: 0.24s; }

/* ── SCROLLBAR ───────────────────────────────────────────── */
.onyx-notif-panel ::-webkit-scrollbar,
.onyx-drawer ::-webkit-scrollbar,
.profile-page ::-webkit-scrollbar { width: 4px; }

.onyx-notif-panel ::-webkit-scrollbar-thumb,
.onyx-drawer ::-webkit-scrollbar-thumb,
.profile-page ::-webkit-scrollbar-thumb {
    background: rgba(255,215,0,0.3);
    border-radius: 2px;
}

/* ── SYNCRO PAGE — bottom nav adjustments ───────────────── */
.syncro-page .chat-container {
    height: calc(100vh - 64px - env(safe-area-inset-bottom, 0px));
}

@media (max-width: 768px) {
    .syncro-page body,
    body.syncro-page {
        padding-bottom: 0 !important;
    }
    .syncro-page .chat-container {
        height: calc(100vh - 64px);
        border-radius: 0;
    }
    /* Move chat input above bottom nav */
    .syncro-page .input-area {
        padding-bottom: max(14px, env(safe-area-inset-bottom));
    }
}

/* ── NAV NOTIFICATION PANEL — full height fix on mobile ─── */
@media (max-width: 768px) {
    .onyx-notif-panel {
        width: 100%;
        right: -100%;
    }
    .onyx-notif-panel.open { right: 0; }

    .onyx-drawer { width: 82vw; max-width: 300px; }
}


@media (max-width: 768px) {
    #backToTop { display: none !important; }
}


/* ── DESKTOP HAMBURGER BUTTON ───────────────────────────── */
.desktop-menu-btn {
    background: none;
    border: none;
    color: var(--text-primary);
    font-size: 1.4rem;
    cursor: pointer;
    padding: 8px 10px;
    border-radius: 8px;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}
.desktop-menu-btn:hover {
    background: rgba(255,215,0,0.1);
    color: #ffd700;
}
/* Hide desktop menu btn on mobile (bottom nav has its own) */
@media (max-width: 768px) {
    .desktop-menu-btn { display: none !important; }
    .menu-toggle { display: none !important; }
    /* Mobile drawer: full width */
    .onyx-drawer {
        width: 100% !important;
        max-width: 100% !important;
        right: -100% !important;
    }
    .onyx-drawer.open { right: 0 !important; }
    /* Mobile drawer items: bigger tap targets */
    .drawer-item {
        padding: 18px 24px !important;
        font-size: 1.05rem !important;
    }
    .drawer-topbar { padding: 24px 20px 18px !important; }
    .drawer-user { padding: 20px 24px !important; }
    .drawer-user-avatar { width: 72px !important; height: 72px !important; }
    .drawer-user-name { font-size: 1.1rem !important; }
    .drawer-theme-row { padding: 18px 24px !important; font-size: 1.05rem !important; }
    .drawer-separator { margin: 6px 24px !important; }
}
/* Desktop drawer stays 300px */
@media (min-width: 769px) {
    .onyx-drawer { width: 300px !important; right: -320px !important; }
    .onyx-drawer.open { right: 0 !important; }
}



/* ====== ANIMATED VIDEO BANNER ====== */
.video-banner {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 600px;
    overflow: hidden;
}

.banner-video {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    object-fit: cover;
    z-index: 1;
    filter: brightness(0.8);
}

.banner-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.4);
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.banner-content {
    text-align: center;
    z-index: 3;
    padding: 0 20px;
    max-width: 900px;
}

.typewriter-container {
    display: inline-block;
    position: relative;
}

.typewriter-text {
    overflow: hidden;
    white-space: nowrap;
    margin: 0 auto;
    letter-spacing: 0.15em;
    animation: typing 3.5s steps(40, end) forwards;
}

.typewriter-text::after {
    content: '|';
    display: inline-block;
    animation: blink-caret 0.75s step-end infinite,
               hide-cursor 0.1s 3.4s forwards;
}

@keyframes typing {
    from { width: 0 }
    to { width: 100% }
}

@keyframes blink-caret {
    from, to { opacity: 1; }
    50% { opacity: 0; }
}

@keyframes hide-cursor {
    to { opacity: 0; visibility: hidden; }
}

.banner-title {
    font-size: 4rem;
    font-weight: 800;
    margin-bottom: 20px;
    color: white;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.7);
}

.banner-title .highlight {
    color: #ffd700;
    text-shadow: 0 0 40px #ffd700;
    animation: textGlow 2s infinite alternate;
}

@keyframes textGlow {
    from { text-shadow: 0 0 30px #ffd700; }
    to   { text-shadow: 0 0 50px #ffed4e; }
}

.banner-subtitle {
    font-size: 1.5rem;
    color: #e6e6e6;
    margin-bottom: 40px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.6;
    animation: fadeInUp 1s ease-out 3.8s both;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}

.banner-buttons {
    display: flex;
    gap: 25px;
    justify-content: center;
    margin-bottom: 60px;
    flex-wrap: wrap;
    animation: fadeInUp 1s ease-out 4s both;
}

.banner-btn {
    padding: 16px 35px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.1rem;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    transition: all 0.3s ease;
    border: none;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

.banner-btn-primary {
    background: linear-gradient(135deg, #ffd700, #ffed4e);
    color: #000000 !important;
    box-shadow: 0 5px 25px rgba(255, 215, 0, 0.4);
    font-weight: 700;
    text-shadow: none !important;
}

.banner-btn-primary i { color: #000000 !important; text-shadow: none !important; }

.banner-btn-primary:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(255, 215, 0, 0.6);
    background: linear-gradient(135deg, #ffed4e, #fff9c4);
    color: #000000 !important;
}

.banner-btn-secondary {
    background: rgba(255, 215, 0, 0.1);
    color: #ffd700;
    border: 2px solid #ffd700;
    backdrop-filter: blur(10px);
}

.banner-btn-secondary:hover {
    background: rgba(255, 215, 0, 0.2);
    transform: translateY(-5px);
    box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
}

.banner-stats {
    display: flex;
    gap: 50px;
    justify-content: center;
    flex-wrap: wrap;
    z-index: 3;
    animation: fadeInUp 1s ease-out 4.2s both;
}

.stat-item {
    text-align: center;
    padding: 25px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 215, 0, 0.2);
    min-width: 180px;
    transition: all 0.3s ease;
    cursor: pointer;
    text-decoration: none;
    display: block;
    animation: float 3s ease-in-out infinite;
}

.stat-item:nth-child(1) { animation-delay: 0s; }
.stat-item:nth-child(2) { animation-delay: 0.5s; }
.stat-item:nth-child(3) { animation-delay: 1s; }

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-15px); }
}

.stat-item:hover {
    transform: translateY(-10px);
    border-color: #ffd700;
    box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
    background: rgba(0, 0, 0, 0.8);
    animation-play-state: paused;
}

.stat-number {
    display: block;
    font-size: 3rem;
    font-weight: 800;
    color: #ffd700;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
    margin-bottom: 10px;
    transition: all 0.3s ease;
}

.stat-item:hover .stat-number { color: #ffed4e; transform: scale(1.1); }

.stat-label {
    font-size: 1rem;
    color: #e6e6e6;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
}

.particles {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0; left: 0;
    z-index: 2;
    pointer-events: none;
}

.particle {
    position: absolute;
    width: 3px; height: 3px;
    background: #ffd700;
    border-radius: 50%;
    box-shadow: 0 0 10px #ffd700;
    animation: floatParticle 20s infinite linear;
}

@keyframes floatParticle {
    0%   { transform: translateY(100vh) translateX(0); opacity: 0; }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.8; }
    100% { transform: translateY(-100px) translateX(100px); opacity: 0; }
}

@media (max-width: 992px) {
    .banner-title { font-size: 3rem; }
    .banner-subtitle { font-size: 1.3rem; }
}

@media (max-width: 768px) {
