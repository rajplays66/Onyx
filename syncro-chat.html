<script>
/* === syncro-script.js === */
// SYNCRO AI | Onyx
const API_URL = '/api/chat';
const LOGO_URL = 'https://i.ibb.co/JjZPmBpV/Picsart-26-04-22-09-03-55-835.jpg';

const SYSTEM_INSTRUCTION = `You are Syncro, the friendly AI assistant for Onyx — a tech platform by Raj (RJ) from Chittagong, Bangladesh. 
Be helpful, friendly and professional. Use markdown in responses.
Products: Web Templates ($49-$199), SaaS Kit ($299), AI Chat System ($199), Custom Development (custom quote).
Contact: 📧 rjsyncro@gmail.com | 📸 instagram.com/o_rj_0`;

let conversationHistory = [];

// Wait for page to fully load
window.onload = function() {
    init();
};

// Also try DOMContentLoaded as backup
document.addEventListener('DOMContentLoaded', function() {
    init();
});

let initialized = false;
function init() {
    if (initialized) return;
    initialized = true;

    const chatMessages    = document.getElementById('chatMessages');
    const userInput       = document.getElementById('userInput');
    const sendButton      = document.getElementById('sendButton');
    const typingIndicator = document.getElementById('typingIndicator');
    const clearBtn        = document.getElementById('clearChatBtn');
    const scrollBtn       = document.getElementById('scrollBottomBtn');

    if (!chatMessages || !userInput || !sendButton) {
        console.error('Critical elements missing!');
        return;
    }

    // Show welcome
    setTimeout(function() {
        addMessage("Hello! I'm **Syncro**, the AI assistant for **Onyx**. 👋\n\nHow can I help you today?", 'bot');
        setTimeout(showQuickReplies, 800);
    }, 3200); // after splash ends at 2.8s

    // Send button
    sendButton.addEventListener('click', function() {
        handleSend();
    });

    // Enter key
    userInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleSend();
        }
    });

    // Clear chat
    if (clearBtn) {
        clearBtn.addEventListener('click', function() {
            if (confirm('Clear conversation?')) {
                chatMessages.innerHTML = '';
                conversationHistory = [];
                setTimeout(function() {
                    addMessage("Hello! I'm **Syncro**, the AI assistant for **Onyx**. 👋\n\nHow can I help you today?", 'bot');
                    setTimeout(showQuickReplies, 800);
                }, 200);
            }
        });
    }

    // Scroll button
    if (scrollBtn) {
        chatMessages.addEventListener('scroll', function() {
            var dist = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
            scrollBtn.style.opacity = dist > 100 ? '1' : '0';
        });
        scrollBtn.addEventListener('click', function() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });
    }

    // ── Handle Send ──────────────────────────────────────────
    async function handleSend(text) {
        var message = text || userInput.value.trim();
        if (!message) return;

        var qr = document.getElementById('quickReplies');
        if (qr) qr.remove();

        if (!text) userInput.value = '';

        addMessage(message, 'user');

        // Show typing
        if (typingIndicator) typingIndicator.style.display = 'flex';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            // Build message with history
            var contextMsg = message;
            if (conversationHistory.length > 0) {
                var hist = conversationHistory.slice(-8)
                    .map(function(m) { return (m.role === 'user' ? 'User' : 'Syncro') + ': ' + m.content; })
                    .join('\n');
                contextMsg = 'Previous:\n' + hist + '\n\nUser: ' + message;
            }

            conversationHistory.push({ role: 'user', content: message });

            var response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: contextMsg,
                    system_instruction: SYSTEM_INSTRUCTION
                })
            });

            var data = await response.json();

            var reply;
            if (!response.ok) {
                reply = '⚠️ Server error ' + response.status + ': ' + (data.error || 'Unknown error');
            } else {
                reply = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text)
                    || (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content)
                    || data.error
                    || JSON.stringify(data);
            }

            conversationHistory.push({ role: 'assistant', content: reply });
            addMessage(reply, 'bot');

        } catch (err) {
            addMessage('😔 Connection error: ' + err.message, 'bot');
        } finally {
            if (typingIndicator) typingIndicator.style.display = 'none';
        }

        userInput.focus();
    }

    // ── Add Message ──────────────────────────────────────────
    function addMessage(text, sender) {
        var div = document.createElement('div');
        div.className = 'message ' + sender + '-message';

        var avatarDiv = document.createElement('div');
        avatarDiv.className = 'message-avatar';

        if (sender === 'bot') {
            var img = document.createElement('img');
            img.src = LOGO_URL;
            img.alt = 'Syncro';
            img.style.cssText = 'width:100%;height:100%;object-fit:contain;border-radius:50%;';
            avatarDiv.style.cssText = 'width:42px;height:42px;min-width:42px;border-radius:50%;border:2px solid #ffd700;box-shadow:0 0 10px rgba(255,215,0,0.35);margin-right:10px;background:#1a1400;padding:2px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;';
            avatarDiv.appendChild(img);
        } else {
            avatarDiv.innerHTML = '👤';
            avatarDiv.style.cssText = 'width:38px;height:38px;min-width:38px;border-radius:50%;background:#1a3a6e;border:1.5px solid rgba(100,140,220,0.4);margin-left:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;';
        }

        var wrapDiv = document.createElement('div');
        wrapDiv.className = 'message-wrap';

        var contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';
        contentDiv.innerHTML = renderMarkdown(text);

        var timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        wrapDiv.appendChild(contentDiv);
        wrapDiv.appendChild(timeDiv);
        div.appendChild(avatarDiv);
        div.appendChild(wrapDiv);
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // ── Quick Replies ────────────────────────────────────────
    function showQuickReplies() {
        var existing = document.getElementById('quickReplies');
        if (existing) existing.remove();

        var container = document.createElement('div');
        container.id = 'quickReplies';
        container.className = 'quick-replies';

        var replies = [
            { label: '🏢 What is Onyx?',   text: 'What is Onyx?' },
            { label: '🛍️ Products',         text: 'What products does Onyx offer?' },
            { label: '✍️ Blog posts',        text: 'What are the latest blog posts?' },
            { label: '📬 Contact Raj',       text: 'How can I contact Raj?' }
        ];

        replies.forEach(function(r) {
            var btn = document.createElement('button');
            btn.className = 'quick-reply-btn';
            btn.textContent = r.label;
            btn.onclick = function() { container.remove(); handleSend(r.text); };
            container.appendChild(btn);
        });

        chatMessages.appendChild(container);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // ── Markdown ─────────────────────────────────────────────
    function renderMarkdown(text) {
        var html = text
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/^[\-\*] (.+)$/gm, '<li>$1</li>')
            .replace(/\n\n/g, '</p><p>')
            .replace(/\n/g, '<br>');

        html = html.replace(/(https?:\/\/[^\s<>"]+)/g, function(url) {
            return '<a href="' + url + '" target="_blank" class="chat-link">' + url + '</a>';
        });

        return '<p>' + html + '</p>';
    }

    // Mobile viewport fix
    function fixVH() {
        document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
    }
    window.addEventListener('resize', fixVH);
    fixVH();
}


/* === onyx-app.js (shared) === */

/* === script.js === */
try {
// DOM Elements
const menuToggle = document.getElementById('menuToggle');
const navMenu = document.getElementById('navMenu');
const themeToggle = document.getElementById('themeToggle') || {querySelector:()=>null, addEventListener:()=>null, classList:{toggle:()=>null}};
// const backToTop = document.getElementById('backToTop');
const contactForm = document.getElementById('contactForm');

// Mobile Menu Toggle — now opens the onyx drawer instead
menuToggle.addEventListener('click', () => {
    // openDrawer is defined in onyx-app.js which loads after this script
    // Use a small delay to ensure it's available
    if (typeof openDrawer === 'function') {
        openDrawer();
    } else {
        document.getElementById('onyxDrawer')?.classList.add('open');
        document.getElementById('drawerOverlay')?.classList.add('open');
    }
});

// Close mobile menu when clicking on a link
document.querySelectorAll('.nav-menu a').forEach(link => {
    link.addEventListener('click', () => {
        navMenu.classList.remove('active');
        menuToggle.innerHTML = '<i class="fas fa-bars"></i>';
    });
});

// Theme Toggle
themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('light-theme');
    if (document.body.classList.contains('light-theme')) {
        if(typeof themeIcon !== 'undefined' && themeIcon) themeIcon.className = 'fas fa-moon';
        localStorage.setItem('theme', 'light');
    } else {
        if(typeof themeIcon !== 'undefined' && themeIcon) themeIcon.className = 'fas fa-sun';
        localStorage.setItem('theme', 'dark');
    }
});

// Check for saved theme preference
const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'light') {
    document.body.classList.add('light-theme');
    if(typeof themeIcon !== 'undefined' && themeIcon) themeIcon.className = 'fas fa-moon';
}

// Back to Top Button
window.addEventListener('scroll', () => {
    if (window.pageYOffset > 300) {
        backToTop.style.display = 'flex';
    } else {
        backToTop.style.display = 'none';
    }
});

backToTop.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
});

// Form Submission
contactForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    alert(`Thank you ${name}! Your message has been sent successfully. I'll get back to you soon at ${email}.`);
    contactForm.reset();
});

// Smooth scroll for anchor links
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const targetId = this.getAttribute('href');
        if (targetId === '#') return;
        const targetElement = document.querySelector(targetId);
        if (targetElement) {
            window.scrollTo({
                top: targetElement.offsetTop - 80,
                behavior: 'smooth'
            });
        }
    });
});

// Newsletter form submission
document.querySelector('.newsletter-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const emailInput = this.querySelector('input[type="email"]');
    const email = emailInput.value;
    if (email) {
        alert(`Thank you! You've subscribed to our newsletter with email: ${email}`);
        emailInput.value = '';
    }
});

// Blog card hover effects
document.querySelectorAll('.blog-card').forEach(card => {
    card.addEventListener('mouseenter', () => { card.style.transform = 'translateY(-10px)'; });
    card.addEventListener('mouseleave', () => { card.style.transform = 'translateY(0)'; });
});

// Active nav link based on scroll position
window.addEventListener('scroll', () => {
    const sections = document.querySelectorAll('section');
    const navLinks = document.querySelectorAll('.nav-menu a');
    let current = '';
    sections.forEach(section => {
        if (window.pageYOffset >= section.offsetTop - 100) {
            current = section.getAttribute('id');
        }
    });
    navLinks.forEach(link => {
        link.classList.remove('active');
        if (link.getAttribute('href') === `#${current}`) {
            link.classList.add('active');
        }
    });
});

// FEATURE 1: LOADING SCREEN
// ====================================================
function initLoader() {
    const loader = document.getElementById('rj-loader');
    if (!loader) return;

    // Hide loader after 2 seconds
    setTimeout(() => {
        loader.classList.add('hide');
        // Remove from DOM after fade-out completes
        setTimeout(() => loader.remove(), 700);
    }, 2000);
}

// ====================================================
// FEATURE 2: SCROLL PROGRESS BAR
// ====================================================
function initScrollProgress() {
    const bar = document.getElementById('scroll-progress');
    if (!bar) return;

    window.addEventListener('scroll', () => {
        const scrollTop = window.scrollY || document.documentElement.scrollTop;
        const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        bar.style.width = progress + '%';
    }, { passive: true });
}

// ====================================================
// FEATURE 3: SCROLL REVEAL ANIMATIONS
// ====================================================
function initScrollReveal() {
    // Assign reveal classes to target elements
    const revealTargets = [
        { selector: '.section-header',    cls: 'reveal' },
        { selector: '.blog-card',         cls: 'reveal reveal-child' },
        { selector: '.about-image',       cls: 'reveal reveal-left' },
        { selector: '.about-text',        cls: 'reveal reveal-right' },
        { selector: '.contact-info',      cls: 'reveal reveal-left' },
        { selector: '.contact-form',      cls: 'reveal reveal-right' },
        { selector: '.footer-logo',       cls: 'reveal' },
        { selector: '.footer-links',      cls: 'reveal reveal-child' },
        { selector: '.footer-newsletter', cls: 'reveal reveal-child' },
        { selector: '.stat-item',         cls: 'reveal reveal-child' },
        { selector: '.skill-tag',         cls: 'reveal reveal-child' },
    ];

    revealTargets.forEach(({ selector, cls }) => {
        document.querySelectorAll(selector).forEach(el => {
            cls.split(' ').forEach(c => el.classList.add(c));
        });
    });

    // IntersectionObserver triggers when element enters viewport
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                observer.unobserve(entry.target); // Animate only once
            }
        });
    }, {
        threshold: 0.12,
        rootMargin: '0px 0px -40px 0px'
    });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
}

// ====================================================
// SMART VIDEO BANNER SWITCHING
// ====================================================
function loadBannerVideo() {
    const video = document.querySelector('.banner-video');
    if (!video) return;

    const isDesktop = window.innerWidth >= 769;
    const videoSrc = isDesktop ? 'banner-desktop.mp4' : 'banner-mobile.mp4';

    // Only reload if source has changed
    const existingSource = video.querySelector('source');
    if (existingSource && existingSource.src.includes(videoSrc)) return;

    video.innerHTML = '';
    const source = document.createElement('source');
    source.src = videoSrc;
    source.type = 'video/mp4';
    video.appendChild(source);
    video.load();

    video.play().catch(() => {
        const existing = document.querySelector('.video-play-btn');
        if (existing) return;
        const playButton = document.createElement('button');
        playButton.className = 'video-play-btn';
        playButton.innerHTML = '<i class="fas fa-play"></i> Play Video';
        playButton.style.cssText = `
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 215, 0, 0.85); color: black;
            border: none; padding: 15px 30px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 700; cursor: pointer;
            z-index: 10; display: flex; align-items: center; gap: 10px;
        `;
        playButton.addEventListener('click', () => { video.play(); playButton.remove(); });
        video.parentElement.appendChild(playButton);
    });
}

// ====================================================
// FLOATING PARTICLES
// ====================================================
function initParticles() {
    const particlesContainer = document.getElementById('particles');
    if (!particlesContainer) return;

    for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const size = Math.random() * 3 + 1;
        const duration = Math.random() * 15 + 10;
        const delay = Math.random() * 5;
        particle.style.left      = Math.random() * 100 + '%';
        particle.style.top       = Math.random() * 100 + '%';
        particle.style.width     = size + 'px';
        particle.style.height    = size + 'px';
        particle.style.opacity   = Math.random() * 0.5 + 0.3;
        particle.style.animation = `floatParticle ${duration}s infinite linear ${delay}s`;
        particlesContainer.appendChild(particle);
    }
}

    function initGoogleSignIn() {
        const wrap = document.getElementById('googleBtnWrap');

        if (GOOGLE_CLIENT_ID === 'YOUR_GOOGLE_CLIENT_ID_HERE') {
            wrap.innerHTML = `<button class="auth-btn google" style="width:100%;justify-content:center;cursor:pointer;" onclick="showToast('Paste your Google Client ID in onyx-app.js to enable this','fa-info-circle');window.open('https://console.cloud.google.com','_blank')">

            </button>`;

        }
        const tryInit = () => {
            if (typeof google === 'undefined' || !google.accounts) { setTimeout(tryInit, 300); return; }
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleCredential,
                auto_select: false,
                cancel_on_tap_outside: true,
            });
            google.accounts.id.renderButton(wrap, {

    function handleGoogleCredential(response) {
        try {
            const base64 = response.credential.split('.')[1];
            const pad = base64.length % 4;
            const padded = base64 + '==='.slice(0, pad ? 4 - pad : 0);
            const payload = JSON.parse(atob(padded.replace(/-/g,'+').replace(/_/g,'/')));
            signIn({ name: payload.name || 'Google User', email: payload.email, avatar: payload.picture || null, provider: 'google' });
        } catch(e) { showToast('Google sign-in failed, try again', 'fa-exclamation-circle'); }
    }

    function handleEmailAuth(mode) {
        const name  = document.getElementById('authName')?.value.trim();
        const email = document.getElementById('authEmail')?.value.trim();
        const pass  = document.getElementById('authPassword')?.value.trim();
        const msg   = document.getElementById('authMsg');
        const setMsg = t => { if(msg) msg.textContent = t; };
        setMsg('');
        if (!email || !/\S+@\S+\.\S+/.test(email)) { setMsg('Enter a valid email address.'); return; }
        if (!pass || pass.length < 6) { setMsg('Password must be at least 6 characters.'); return; }
        const users = Store.get('onyx_users', {});
        if (mode === 'register') {
            if (!name) { setMsg('Enter your name to register.'); return; }
            if (users[email]) { setMsg('Account already exists. Try signing in.'); return; }
            users[email] = { name, email, passHash: btoa(unescape(encodeURIComponent(pass))), avatar: null };
            Store.set('onyx_users', users);
            signIn({ name, email, avatar: null, provider: 'email' });
        } else {
            const user = users[email];
            if (!user) { setMsg('No account found. Register first.'); return; }
            if (btoa(unescape(encodeURIComponent(pass))) !== user.passHash) { setMsg('Incorrect password.'); return; }
            signIn({ name: user.name, email, avatar: user.avatar, provider: 'email' });
        }
    }

                state.user.name = name;
                state.user.bio = bio;
                if (!state.user.provider) state.user.email = email;
                Store.set('onyx_user', state.user);
            }
            document.getElementById('profileNameDisplay').textContent = name;
            showToast('Profile saved! ✨', 'fa-check-circle');
        });

        document.getElementById('profileLogout')?.addEventListener('click', () => {
            if (confirm('Log out of Onyx?')) {
                Store.remove('onyx_user');
                state.user = null;
                closeProfile();
                showToast('Logged out', 'fa-sign-out-alt');
                setTimeout(() => location.reload(), 800);
            }
        });
    }

    function openProfile() {
        if (!state.user) { openAuth(); return; }
        state.profileOpen = true;
        // Rebuild in case bookmarks changed
        const page = document.getElementById('profilePage');
        if (page) { page.innerHTML = buildProfileHTML(); bindProfileEvents(); }
        document.getElementById('profilePage')?.classList.add('open');
    }

    function closeProfile() {
        state.profileOpen = false;
        document.getElementById('profilePage')?.classList.remove('open');
    }

    /* ── BUILD NOTIFICATIONS PANEL ───────────────────────── */
    function buildNotifPanel() {
        const overlay = document.createElement('div');
        overlay.className = 'onyx-drawer-overlay';
        overlay.id = 'notifOverlay';
        overlay.addEventListener('click', closeNotifPanel);

        const panel = document.createElement('div');
        panel.className = 'onyx-notif-panel';
        panel.id = 'notifPanel';
        panel.innerHTML = buildNotifHTML();

        document.body.appendChild(overlay);
        document.body.appendChild(panel);

        bindNotifEvents();
    }

    function buildNotifHTML() {
        const items = state.notifications.map(n => `
            <div class="notif-item ${n.unread ? 'unread' : ''}" data-id="${n.id}">
                <div class="notif-icon"><i class="fas ${n.icon}"></i></div>
                <div class="notif-content">
                    <h4>${n.title}</h4>
                    <p>${n.body}</p>
                    <div class="notif-time">${n.time}</div>
                </div>
            </div>`).join('');

        return `
        <div class="notif-header">
            <button class="notif-back-btn" id="notifBackBtn" onclick="document.getElementById('notifPanel').classList.remove('open');document.getElementById('notifOverlay').classList.remove('open');" style="background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.2);color:#ffd700;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.9rem;flex-shrink:0;">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h3><i class="fas fa-bell"></i> Notifications</h3>
            <button class="notif-clear" id="notifClearAll">Clear all</button>
        </div>
        <div class="notif-list" id="notifList">
            ${items || '<div style="text-align:center;color:#444;padding:30px;font-size:0.9rem;">No notifications</div>'}
        </div>`;
    }

    function bindNotifEvents() {
        document.getElementById('notifClearAll')?.addEventListener('click', () => {
            state.notifications = [];
            Store.set('onyx_notifs', []);
            const list = document.getElementById('notifList');
            if (list) list.innerHTML = '<div style="text-align:center;color:#444;padding:30px;font-size:0.9rem;">No notifications</div>';
            // Clear badge
            const badge = document.querySelector('#navNotif .onyx-nav-badge');
            if (badge) badge.remove();
            showToast('Notifications cleared', 'fa-check');
        });

        document.querySelectorAll('.notif-item').forEach(item => {
            item.addEventListener('click', function () {
                const id = +this.dataset.id;
                const notif = state.notifications.find(n => n.id === id);
                if (notif) { notif.unread = false; Store.set('onyx_notifs', state.notifications); }
                this.classList.remove('unread');
                updateNotifBadge();
            });
        });
    }

    function updateNotifBadge() {
        const count = state.notifications.filter(n => n.unread).length;
        const badge = document.querySelector('#navNotif .onyx-nav-badge');
        if (count > 0) {
            if (badge) badge.textContent = count;
        } else {
            badge?.remove();
        }
    }

    function openNotifPanel() {
        state.notifOpen = true;
        document.getElementById('notifPanel').classList.add('open');
        document.getElementById('notifOverlay').classList.add('open');
    }

    function closeNotifPanel() {
        state.notifOpen = false;
        document.getElementById('notifPanel')?.classList.remove('open');
        document.getElementById('notifOverlay')?.classList.remove('open');
    }

    /* ── FLOATING SYNCRO BUBBLE ──────────────────────────── */
    function buildFloatBubble() {
        // Don't show on Syncro page
        if (document.body.classList.contains('syncro-page')) return;
        const btn = document.createElement('a');
        btn.className = 'syncro-float-btn';
        btn.href = 'syncro-chat.html';
        btn.title = 'Chat with Syncro AI';
        btn.innerHTML = `
            <img src="https://i.ibb.co/JjZPmBpV/Picsart-26-04-22-09-03-55-835.jpg" alt="Syncro AI">
            <span class="syncro-float-tooltip">Chat with Syncro</span>`;
        document.body.appendChild(btn);
    }

    /* ── BOOKMARK BUTTONS ON BLOG CARDS ──────────────────── */
    function initBookmarks() {
        const cards = document.querySelectorAll('.blog-card');
        cards.forEach(card => {
            // Make sure card has relative positioning (CSS handles this too)
            const btn = document.createElement('button');
            btn.className = 'bookmark-btn';
            btn.title = 'Save post';
            btn.innerHTML = '<i class="fas fa-bookmark"></i>';

            const title = card.querySelector('h3')?.textContent || 'Untitled';
            const img = card.querySelector('img')?.src || '';
            const link = card.querySelector('a')?.href || '#';

            const isSaved = state.bookmarks.some(b => b.title === title);
            if (isSaved) btn.classList.add('saved');

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                e.preventDefault();
                toggleBookmark(btn, { title, img, href: link });
            });

            card.appendChild(btn);
        });
    }

    function toggleBookmark(btn, post) {
        const idx = state.bookmarks.findIndex(b => b.title === post.title);
        if (idx > -1) {
            state.bookmarks.splice(idx, 1);
            btn.classList.remove('saved');
            showToast('Removed from saved', 'fa-bookmark');
        } else {
            state.bookmarks.push(post);
            btn.classList.add('saved');
            showToast('Post saved! 🔖', 'fa-bookmark');
        }
        Store.set('onyx_bookmarks', state.bookmarks);
    }

    /* ── SECTION ANIMATIONS ──────────────────────────────── */
    function initSectionAnimations() {
        const config = [
            // Each entry: [selector, animation-class, threshold]
            ['.video-banner, .hero',            'section-anim-hero',    0.05],
            ['.blog-card',                       'section-anim-blog',    0.12],
            ['.about-content, .about-text, .about-image', 'section-anim-about', 0.12],
            ['.contact-content, .contact-form, .contact-info', 'section-anim-contact', 0.1],
            ['.stat-item',                       'section-anim-stat',    0.2],
            ['.footer',                          'section-anim-footer',  0.05],
        ];

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    // Find which class to apply
                    config.forEach(([sel, cls]) => {
                        if (entry.target.matches(sel)) {
                            entry.target.classList.add(cls);
                        }
                    });
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });

        config.forEach(([sel]) => {
            document.querySelectorAll(sel).forEach(el => {
                // Set invisible before animation triggers
                el.style.opacity = '0';
                observer.observe(el);
            });
        });
    }

    /* ── THEME PERSISTENCE ───────────────────────────────── */
    function applyTheme() {
        if (state.theme === 'light') {
            document.body.classList.add('light-theme');
            document.body.classList.remove('dark-theme');
        } else {
            document.body.classList.remove('light-theme');
            document.body.classList.add('dark-theme');
        }
        // Sync the toggle knob
        const toggle = document.getElementById('drawerThemeToggle');
        if (toggle) toggle.classList.toggle('on', state.theme === 'dark');
        // Sync hidden theme icon for any existing JS that checks it
        const icon = document.querySelector('#themeToggle i');
        if (icon) icon.className = state.theme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
    }

    /* ── KEYBOARD / SWIPE CLOSE ──────────────────────────── */
    function initGestures() {
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeDrawer();
                closeNotifPanel();
                closeAuth();
                closeProfile();
            }
        });

        // Swipe right to close drawers / profile
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (dx > 70) {
                if (state.drawerOpen) closeDrawer();
                if (state.notifOpen) closeNotifPanel();
                if (state.profileOpen) closeProfile();
            }
        }, { passive: true });
    }

    /* ── INIT ────────────────────────────────────────────── */
    function init() {
        applyTheme();
        buildBottomNav();
        buildDrawer();
        buildAuth();
        buildProfile();
        buildNotifPanel();
        buildFloatBubble();
        initBookmarks();
        initSectionAnimations();
        initGestures();

        // Show welcome notification for new users after 3s
        if (!Store.get('onyx_welcomed')) {
            setTimeout(() => {
                showToast('Welcome to Onyx! 👋', 'fa-star');
                Store.set('onyx_welcomed', true);
            }, 3000);
        }

        console.log('🔥 Onyx App UI loaded');
        // Expose globally so old script.js menuToggle can call openDrawer
        window.openDrawer = openDrawer;
        window.closeDrawer = closeDrawer;
    }

    /* Run after DOM + existing scripts are ready */
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        // Small delay to not fight with existing scripts
        setTimeout(init, 100);
    }

})();



// Expose globally
window.openDrawer = openDrawer;
window.closeDrawer = closeDrawer;

// Page active nav
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.onyx-nav-item').forEach(el => el.classList.remove('active'));
    const activeEl = document.getElementById('navSyncro');
    if (activeEl) activeEl.classList.add('active');
});
</script>

// Splash animation
(function() {
    var splash = document.getElementById('syncro-splash');
    var chatApp = document.getElementById('chatApp');
    var pc = document.getElementById('splashParticles');
    for (var i = 0; i < 40; i++) {
        var p = document.createElement('div');
        p.className = 'splash-particle';

        p.style.cssText = 'left:' + (Math.random()*100) + '%;top:' + (Math.random()*100) + '%;width:' + size + 'px;height:' + size + 'px;opacity:' + (Math.random()*0.6+0.2) + ';animation-duration:' + (Math.random()*8+6) + 's;animation-delay:' + (Math.random()*3) + 's;';
        pc.appendChild(p);
    }
    setTimeout(function() {
        splash.classList.add('splash-exit');
        chatApp.classList.add('chat-enter');
        setTimeout(function() { splash.style.display = 'none'; }, 800);
    }, 2800);
})();
</script>
