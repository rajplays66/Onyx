<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncro AI | RJSyncro</title>
    <link rel="stylesheet" href="syncro-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="https://i.ibb.co/JWxk510V/Gemini-Generated-Image-ag7dhdag7dhdag7d-removebg-preview.png">
    <style>
        /* Force gold theme */
        body {
            background: #000000 !important;
            background: linear-gradient(135deg, #000000, #0a0a0a, #111111) !important;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Chat Header -->
<div class="chat-header">
    <!-- Header Logo -->
    <div class="bot-avatar">
        <img src="https://i.ibb.co/JWxk510V/Gemini-Generated-Image-ag7dhdag7dhdag7d-removebg-preview.png" 
             alt="Syncro AI" 
             class="ai-logo">
    </div>
    <div class="bot-info">
        <h2>Syncro AI</h2>
        <p class="bot-tagline">Your AI assistant for RJSyncro</p>
    </div>
    <a href="index.html" class="home-button" title="Back to Home">
        <i class="fas fa-home"></i>
    </a>
</div>

        <!-- Chat Messages Area -->
        <div class="chat-messages" id="chatMessages">
            <!-- Messages will be added by JavaScript -->
        </div>

        <!-- Typing indicator -->
        <div class="typing-indicator" id="typingIndicator" style="display: none;">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Chat Input Area -->
        <div class="input-area">
            <input type="text" 
                   id="userInput" 
                   placeholder="Ask Syncro anything..." 
                   autocomplete="off">
            <button id="sendButton">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>

        <!-- Footer Info -->
        <div class="chat-footer">
            <p>Powered by Google's Gemini AI. Conversations are processed securely.</p>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="syncro-script.js"></script>
</body>
</html>
